spring:
  application:
    name: gateway-server

  profiles:
    active: dev

  http:
    codecs:
      max-in-memory-size: 10MB # 调整缓冲区大小https://gitee.com/zhijiantianya/aifuli-cloud/pulls/176

  # Jackson 配置项
  jackson:
    serialization:
      write-dates-as-timestamps: true # 设置 LocalDateTime 的格式，使用时间戳
      write-date-timestamps-as-nanoseconds: false # 设置不使用 nanoseconds 的格式。例如说 1611460870.401，而是直接 1611460870401
      write-durations-as-timestamps: true # 设置 Duration 的格式，使用时间戳
      fail-on-empty-beans: false # 允许序列化无属性的 Bean

  main:
    allow-circular-references: true # 允许循环依赖，因为项目是三层架构，无法避免这个情况。

  config:
    import:
      - optional:classpath:application-${spring.profiles.active}.yaml # 加载【本地】配置
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.yaml # 加载【Nacos】的配置

  cloud:
    # Spring Cloud Gateway 配置项，对应 GatewayProperties 类
    gateway:
      server:
        webflux:
          # 路由配置项，对应 RouteDefinition 数组
          routes:
            ## system-server 服务
            - id: system-admin-api # 路由的编号
              uri: grayLb://system-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/admin-api/system/**
              filters:
                  - RewritePath=/admin-api/system/v3/api-docs, /v3/api-docs # 配置，保证转发到 /v3/api-docs
            - id: system-app-api # 路由的编号
              uri: grayLb://system-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/app-api/system/**
              filters:
                  - RewritePath=/app-api/system/v3/api-docs, /v3/api-docs
            ## infra-server 服务
            - id: infra-admin-api # 路由的编号
              uri: grayLb://infra-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/admin-api/infra/**
              filters:
                  - RewritePath=/admin-api/infra/v3/api-docs, /v3/api-docs
            - id: infra-app-api # 路由的编号
              uri: grayLb://infra-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/app-api/infra/**
              filters:
                  - RewritePath=/app-api/infra/v3/api-docs, /v3/api-docs
            - id: infra-spring-boot-admin # 路由的编号（Spring Boot Admin）
              uri: grayLb://infra-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/admin/**
            - id: infra-websocket # 路由的编号（WebSocket）
              uri: grayLb://infra-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/infra/ws/**
            ## member-server 服务
            - id: member-admin-api # 路由的编号
              uri: grayLb://member-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/admin-api/member/**
              filters:
                - RewritePath=/admin-api/member/v3/api-docs, /v3/api-docs
            ## supply-chain-server 服务
            - id: supply-chain-admin-api # 供应链管理端与 Swagger 文档
              uri: grayLb://supply-chain-server
              predicates:
                - Path=/admin-api/supply-chain/**
              filters:
                - RewritePath=/admin-api/supply-chain/v3/api-docs, /v3/api-docs
            - id: member-app-api # 路由的编号
              uri: grayLb://member-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/app-api/member/**
              filters:
                - RewritePath=/app-api/member/v3/api-docs, /v3/api-docs
            - id: member-open-api # 路由的编号
              uri: grayLb://member-server
              predicates: # 断言，作为开放接口路由的匹配条件
                - Path=/app-api/open/mall/v1/**
            ## ai-server 服务
            - id: ai-admin-api # 路由的编号
              uri: grayLb://ai-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/admin-api/ai/**
              filters:
                - RewritePath=/admin-api/ai/v3/api-docs, /v3/api-docs # 配置，保证转发到 /v3/api-docs
            - id: ai-mcp-server # 路由的编号（MCP Server）
              uri: grayLb://ai-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/sse, /mcp/message
            ## iot-server 服务
            - id: iot-admin-api # 路由的编号
              uri: grayLb://iot-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/admin-api/iot/**
              filters:
                - RewritePath=/admin-api/iot/v3/api-docs, /v3/api-docs # 配置，保证转发到 /v3/api-docs
            ## mes-server 服务
            - id: mes-admin-api # 路由的编号
              uri: grayLb://mes-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/admin-api/mes/**
              filters:
                - RewritePath=/admin-api/mes/v3/api-docs, /v3/api-docs # 配置，保证转发到 /v3/api-docs
            ## wms-server 服务
            - id: wms-admin-api # 路由的编号
              uri: grayLb://wms-server
              predicates: # 断言，作为路由的匹配条件，对应 RouteDefinition 数组
                - Path=/admin-api/wms/**
              filters:
                - RewritePath=/admin-api/wms/v3/api-docs, /v3/api-docs # 配置，保证转发到 /v3/api-docs
            ## supply-chain-server：默认 Nacos grayLb；supplyhub 用 AIFULI_GATEWAY_SUPPLY_CHAIN_URI 指向本机 58190。
            ## 设计见 docs/superpowers/specs/2026-09-04-supplyhub-test-docker-compose-design.md#7-gateway-与供应链静态路由
            - id: supply-chain-admin-api
              uri: "${AIFULI_GATEWAY_SUPPLY_CHAIN_URI:grayLb://supply-chain-server}"
              predicates:
                - Path=/admin-api/supply-chain/**
              filters:
                - RewritePath=/admin-api/supply-chain/v3/api-docs, /v3/api-docs
            - id: supply-chain-app-api
              uri: "${AIFULI_GATEWAY_SUPPLY_CHAIN_URI:grayLb://supply-chain-server}"
              predicates:
                - Path=/app-api/supply-chain/**
          x-forwarded:
            prefix-enabled: false # 避免 Swagger 重复带上额外的 /admin-api/system 前缀
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin # 采用 https://github.com/spring-cloud/spring-cloud-gateway/pull/866 解决响应头重复问题

server:
  port: 58080

logging:
  file:
    name: ${user.home}/logs/${spring.application.name}.log # 日志文件名，全路径

knife4j:
  # 聚合 Swagger 文档，参考 https://doc.xiaominfo.com/docs/action/springcloud-gateway 文档
  gateway:
    enabled: true
    routes:
      - name: system-server
        service-name: system-server
        url: /admin-api/system/v3/api-docs
      - name: infra-server
        service-name: infra-server
        url: /admin-api/infra/v3/api-docs
      - name: member-server
        service-name: member-server
        url: /admin-api/member/v3/api-docs
      - name: supply-chain-server
        service-name: supply-chain-server
        url: /admin-api/supply-chain/v3/api-docs
      - name: ai-server
        service-name: ai-server
        url: /admin-api/ai/v3/api-docs
      - name: iot-server
        service-name: iot-server
        url: /admin-api/iot/v3/api-docs
      - name: mes-server
        service-name: mes-server
        url: /admin-api/mes/v3/api-docs
      - name: wms-server
        service-name: wms-server
        url: /admin-api/wms/v3/api-docs
      - name: supply-chain-server
        service-name: supply-chain-server
        url: /admin-api/supply-chain/v3/api-docs

--- #################### 芋道相关配置 ####################

aifuli:
  info:
    version: 1.0.0
