# 爱福利测试环境 Nginx。仓库模板仅覆盖 aifuli-test / aifulih5-test。
# 线上 /etc/nginx/conf.d/aifuli-test.conf 另有 server_name wusheng.qihaofu.cn，
# 发布时只合并 location，禁止用本文件整份覆盖线上。
# WebSocket 升级请求的 Connection 请求头。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream aifuli_test_gateway {
    server 127.0.0.1:58080;
    keepalive 32;
}

server {
    listen 80;
    server_name aifuli-test.qihaofu.cn;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name aifuli-test.qihaofu.cn;

    ssl_certificate     /etc/nginx/certs/aifuli-test/qihaofu.cn.pem;
    ssl_certificate_key /etc/nginx/certs/aifuli-test/qihaofu.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /data/aifuli-test/frontend/admin;
    index index.html;
    client_max_body_size 100m;

    location ^~ /admin-api/ {
        proxy_pass http://aifuli_test_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location ^~ /app-api/ {
        proxy_pass http://aifuli_test_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location ^~ /infra/ws/ {
        proxy_pass http://aifuli_test_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Knife4j 在网关 :58080；公网 /doc.html 不得被管理端 SPA try_files 吃掉。
    location = /doc.html {
        proxy_pass http://aifuli_test_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /webjars/ {
        proxy_pass http://aifuli_test_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /v3/api-docs {
        proxy_pass http://aifuli_test_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        try_files $uri =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|svg|ico|woff|woff2|ttf)$ {
        expires 7d;
        access_log off;
    }
}

server {
    listen 80;
    server_name aifulih5-test.qihaofu.cn;

    return 301 https://$host$request_uri;
}

