# supplyhubtest.qihaofu.cn — 只反代 API 到 pro143 新 gateway :59080。
# 安装到 pro197：/usr/local/nginx/conf/vhost/
# 不要在本文件重复 map $http_upgrade（aifuli-test.conf 已定义）。
# 不要用 upstream + keepalive：pro197 为 nginx 1.13.7；反代端口必须 ≤65535。
# 设计见 docs/superpowers/specs/2026-09-04-supplyhub-test-docker-compose-design.md#9-pro197-nginx

server {
    listen 80;
    server_name supplyhubtest.qihaofu.cn;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name supplyhubtest.qihaofu.cn;

    ssl_certificate     /usr/local/nginx/conf/certs/qihaofu.cn.pem;
    ssl_certificate_key /usr/local/nginx/conf/certs/qihaofu.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100m;

    location ^~ /admin-api/ {
        proxy_pass http://172.19.64.105:59080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location ^~ /app-api/ {
        proxy_pass http://172.19.64.105:59080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # 仅匹配项目下单、查单、资产查询；POST准入由网关负责，不改原始正文或验签头。
    # 设计见 docs/superpowers/specs/2026-10-12-project-standard-order-public-routing-design.md#2-精确路径与透传边界。
    # v2独立SKU契约见 docs/superpowers/specs/2026-10-12-platform-sku-order-contract-design.md#7-端到端安全接线。
    location ~ ^/open-api/supply-chain/project/v(1|2)/orders(/query|/assets/query)?$ {
        client_max_body_size 1m;
        proxy_pass http://172.19.64.105:59080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors off;
    }

    # 华昇回调经网关进入独立供应链；保留正文及默认透传的 Appid/X-Sign/trace-id。
    # 设计见 docs/superpowers/specs/2026-10-12-huasheng-callback-routing-design.md#3-精确路由与透传。
    location ^~ /callbacks/suppliers/huasheng/ {
        client_max_body_size 1m;
        proxy_pass http://172.19.64.105:59080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors off;
    }

    location ^~ /infra/ws/ {
        proxy_pass http://172.19.64.105:59080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 600s;
    }

    location = /doc.html {
        proxy_pass http://172.19.64.105:59080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /webjars/ {
        proxy_pass http://172.19.64.105:59080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /v3/api-docs {
        proxy_pass http://172.19.64.105:59080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        default_type text/plain;
        return 200 "supplyhubtest API only. Upload admin static files later.\n";
    }
}
