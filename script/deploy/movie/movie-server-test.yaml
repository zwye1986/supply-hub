# XXL-JOB 执行器启用即注册全部 Handler；任务启停和执行时间只在调度中心管理。
# 启用前配置调度中心地址和双方一致的令牌。
xxl:
  job:
    enabled: ${MOVIE_XXL_JOB_ENABLED:false}
    admin:
      addresses: ${MOVIE_XXL_JOB_ADMIN_ADDRESSES:}
    access-token: ${MOVIE_XXL_JOB_ACCESS_TOKEN:}
    executor:
      appname: ${MOVIE_XXL_JOB_APPNAME:${spring.application.name}}
      ip: ${MOVIE_XXL_JOB_IP:}
      port: ${MOVIE_XXL_JOB_PORT:19191}
      logpath: ${MOVIE_XXL_JOB_LOG_PATH:${user.home}/logs/xxl-job/${spring.application.name}}
      logretentiondays: ${MOVIE_XXL_JOB_LOG_RETENTION_DAYS:30}

# 独立电影供给同步，先完成显式 MySQL 迁移和 MongoDB 索引部署再开启。
# 设计：docs/superpowers/specs/2026-09-16-movie-supply-schedule-design.md
movie:
  supply:
    # 三渠道统一停售提前量；Nacos 刷新后下次查询生效，不影响采集入库。
    stop-sell-before-start: 45m
    max-pages: ${MOVIE_SUPPLY_MAX_PAGES:1000}
    # 逗号分隔渠道，清空字符串关闭全部采集；Nacos刷新后下一轮生效。
    enabled-channels: "JC,JY,LX"
    # 两端配置相同的独立服务令牌，至少32字符，不使用供应商密钥。
    config-token: ${MOVIE_CONFIG_RPC_TOKEN:}
