spring:
  cloud:
    nacos:
      server-addr: 47.117.130.100:8848 # Nacos 服务器地址
      username: nacos # Nacos 账号
      password: "!2026NacosAdmin@Qhf." # Nacos 密码，! 开头必须使用引号避免 YAML 解析为 tag
      discovery:
        enabled: false # 本地单机开发默认关闭向 Nacos 注册；联调网关如需服务发现可开启为 true
        namespace: aifuli-supplyhub-local # 命名空间。这里使用 aifuli-supplyhub-local 开发环境
        group: DEFAULT_GROUP
      config:
        enabled: false # 本地单机开发默认从本地 application-local.yaml 读取；如需从 Nacos 读取配置可开启为 true
        namespace: aifuli-supplyhub-local # 命名空间。这里使用 aifuli-supplyhub-local 开发环境
        group: DEFAULT_GROUP

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

knife4j:
  enable: true

aifuli:
  supply-chain:
    auth:
      # 本地开发/自动化测试专用固定主密钥；生产必须通过环境变量注入，禁止沿用本值。
      master-key: ${AIFULI_SUPPLY_CHAIN_AUTH_MASTER_KEY:MDEyMzQ1Njc4OWFiY2RlZmdoaWprbG1ub3BxcnN0dXY=}
    security:
      key-version: local-v1
      envelope-key-base64: ${AIFULI_SUPPLY_CHAIN_ENVELOPE_KEY:MDEyMzQ1Njc4OWFiY2RlZmdoaWprbG1ub3BxcnN0dXY=}
      fingerprint-key-base64: ${AIFULI_SUPPLY_CHAIN_FINGERPRINT_KEY:MDEyMzQ1Njc4OWFiY2RlZmdoaWprbG1ub3BxcnN0dXY=}
    openapi:
      enabled: true

# 渠道服务 CHANNEL_NOTIFY 投递：local 联调启用 RPC，指向本地渠道服务
tbsg:
  channel:
    rpc:
      enabled: true
    notify-base-url: http://127.0.0.1:48400/taobaoh5
    http-connect-timeout-seconds: 5
    http-request-timeout-seconds: 10
