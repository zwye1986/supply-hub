  - changeSet:
      id: 056-connector-published-flag
      author: supply-chain
      # D1：sc_supplier_connector 加生成列 published_flag（current_version_id 非空→1，否则 NULL）
      # + (supplier_id, published_flag) 唯一键，强制每供应商至多一个已发布连接器（C3）。
      # 加唯一键前的历史阻断检查：存量若已有供应商持有 2+ 已发布连接器（current_version_id 非空）即 HALT，
      # 保留原数据供离线核实，不自动修复。设计见
      # docs/superpowers/specs/2026-10-03-supplier-offer-publication-admin-design.md#55-d1-published_flag-唯一键变更集-056
      preConditions:
        - onFail: HALT
          onError: HALT
          sqlCheck:
            expectedResult: 0
            sql: >-
              SELECT COUNT(*) FROM (
                SELECT supplier_id FROM sc_supplier_connector
                WHERE current_version_id IS NOT NULL
                GROUP BY supplier_id HAVING COUNT(*) > 1) dup_published_connector
      changes:
        - sqlFile:
            path: 056-connector-published-flag.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            splitStatements: true
            stripComments: false
