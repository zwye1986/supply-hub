  - changeSet:
      id: 054-credential-set
      author: supply-chain
      # AD-3：新建 sc_credential_set / sc_credential_item 两表（F1-hybrid ENV+ENVELOPE 凭据模型）。
      # 全新建表，无存量数据，无需 HALT 预条件。
