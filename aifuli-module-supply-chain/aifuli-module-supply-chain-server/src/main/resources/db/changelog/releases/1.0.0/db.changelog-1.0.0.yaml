  - changeSet:
      id: 051-standard-quote-permanent-key
      author: supply-chain
      # 破坏性 DDL 前的历史阻断检查：任一冲突即 HALT，保留原数据供离线核实，不自动修复。
      # 设计见 docs/superpowers/specs/2026-10-02-standard-internal-quote-freeze-design.md#4-增量DDL与历史阻断检查
      preConditions:
        - onFail: HALT
          onError: HALT
          sqlCheck:
            expectedResult: 0
            sql: >-
              SELECT COUNT(*) FROM (
                SELECT project_id, buyer_order_no FROM sc_standard_pricing_quote
                GROUP BY project_id, buyer_order_no HAVING COUNT(*) > 1) dup_project_key
        - sqlCheck:
            expectedResult: 0
            sql: >-
              SELECT COUNT(*) FROM sc_standard_pricing_quote q
              LEFT JOIN sc_buyer_project p ON p.id = q.project_id
              LEFT JOIN sc_project_listing l ON l.id = q.listing_id AND l.project_id = q.project_id
              LEFT JOIN sc_buyer_product bp ON bp.id = l.buyer_product_id AND bp.buyer_id = q.buyer_id
              LEFT JOIN sc_platform_sku s ON s.id = q.platform_sku_id
              WHERE p.id IS NULL OR p.buyer_id <> q.buyer_id OR l.id IS NULL OR bp.id IS NULL
                 OR bp.platform_sku_id <> q.platform_sku_id OR s.id IS NULL
                 OR s.sku_code <> q.platform_sku_code
        - sqlCheck:
            expectedResult: 0
            sql: >-
              SELECT COUNT(*) FROM sc_standard_pricing_quote q
              WHERE (q.status = 'CONSUMED' AND (q.consumed_order_id IS NULL OR q.consumed_at IS NULL))
                 OR (q.status = 'ISSUED' AND (q.consumed_order_id IS NOT NULL OR q.consumed_at IS NOT NULL))
        - sqlCheck:
            expectedResult: 0
            sql: >-
              SELECT COUNT(*) FROM sc_standard_pricing_quote q
              LEFT JOIN sc_supply_chain_order o ON o.id = q.consumed_order_id
              WHERE q.status = 'CONSUMED'
                AND (o.id IS NULL OR o.pricing_quote_id IS NULL OR o.pricing_quote_id <> q.id
                   OR o.order_type <> 'CARD' OR o.buyer_id <> q.buyer_id OR o.project_id <> q.project_id
                   OR o.buyer_order_no IS NULL OR o.buyer_order_no <> q.buyer_order_no
                   OR o.platform_sku_id IS NULL OR o.platform_sku_id <> q.platform_sku_id
                   OR o.quantity IS NULL OR o.quantity <> q.quantity
                   OR o.sales_unit_price_cents IS NULL OR o.sales_unit_price_cents <> q.sales_unit_price_cents
                   OR o.product_subtotal_cents IS NULL OR o.product_subtotal_cents <> q.product_subtotal_cents
                   OR o.service_fee_cents IS NULL OR o.service_fee_cents <> q.service_fee_cents
                   OR o.user_payable_amount_cents IS NULL OR o.user_payable_amount_cents <> q.user_payable_amount_cents)
      changes:
        - sqlFile:
            path: 051-standard-quote-permanent-key.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            splitStatements: true
            stripComments: false
  - changeSet:
      id: 052-standard-order-project-key
      author: supply-chain
      # 破坏性 DDL 前的历史阻断检查：重复项目键（回执/总单）、旧唯一键保留场景重复（回执/总单）、
      # 回执与总单的项目归属链断裂（含 CARD 总单缺 project/回执缺 project 的相互不一致）、
      # 回执↔总单双向关联断裂、STANDARD_REQUEST 路由主体键映射冲突（关联孤儿/非 CARD、
      # 转换后唯一键冲突、旧键占用新键的腾挪瞬时冲突）。任一冲突即 HALT，保留原数据供离线核实，不自动修复。
      # 设计见 docs/superpowers/specs/2026-10-02-standard-acceptance-project-key-design.md#5-052增量历史清理与安全覆盖
      preConditions:
        - onFail: HALT
          onError: HALT
          sqlCheck:
            expectedResult: 0
            sql: >-
              SELECT COUNT(*) FROM (
                SELECT project_id, buyer_order_no FROM sc_fulfillment_acceptance_receipt
                WHERE project_id IS NOT NULL
                GROUP BY project_id, buyer_order_no HAVING COUNT(*) > 1) dup_receipt_project_key
        - sqlCheck:
            expectedResult: 0
            sql: >-
              SELECT COUNT(*) FROM (
                SELECT project_id, buyer_order_no FROM sc_supply_chain_order
                WHERE order_type = 'CARD' AND project_id IS NOT NULL
                GROUP BY project_id, buyer_order_no HAVING COUNT(*) > 1) dup_order_project_key
        - sqlCheck:
            expectedResult: 0
            sql: >-
              SELECT COUNT(*) FROM (
                SELECT buyer_id, buyer_order_no FROM sc_fulfillment_acceptance_receipt
                WHERE project_id IS NULL
                GROUP BY buyer_id, buyer_order_no HAVING COUNT(*) > 1) dup_receipt_legacy_key
        - sqlCheck:
            expectedResult: 0
            sql: >-
              SELECT COUNT(*) FROM (
                SELECT buyer_id, buyer_order_no FROM sc_supply_chain_order
                WHERE NOT (order_type = 'CARD' AND project_id IS NOT NULL) AND buyer_order_no IS NOT NULL
                GROUP BY buyer_id, buyer_order_no HAVING COUNT(*) > 1) dup_order_legacy_key
        - sqlCheck:
            expectedResult: 0
            sql: >-
              SELECT COUNT(*) FROM sc_fulfillment_acceptance_receipt r
              LEFT JOIN sc_buyer_project p ON p.id = r.project_id
              WHERE r.project_id IS NOT NULL AND (p.id IS NULL OR p.buyer_id <> r.buyer_id)
        - sqlCheck:
            expectedResult: 0
            sql: >-
              SELECT COUNT(*) FROM sc_supply_chain_order o
              LEFT JOIN sc_buyer_project p ON p.id = o.project_id
              WHERE o.project_id IS NOT NULL AND (p.id IS NULL OR p.buyer_id <> o.buyer_id)
        - sqlCheck:
            expectedResult: 0
            sql: >-
              SELECT COUNT(*) FROM sc_supply_chain_order o
              LEFT JOIN sc_fulfillment_acceptance_receipt r ON r.id = o.acceptance_receipt_id
              WHERE o.order_type = 'CARD'
                AND (r.id IS NULL OR r.result_order_id IS NULL OR r.result_order_id <> o.id
                 OR r.buyer_id <> o.buyer_id OR r.buyer_order_no <> o.buyer_order_no
                 OR NOT (r.project_id <=> o.project_id))
        - sqlCheck:
            expectedResult: 0
            sql: >-
              SELECT COUNT(*) FROM sc_fulfillment_acceptance_receipt r
              LEFT JOIN sc_supply_chain_order o ON o.id = r.result_order_id
              WHERE r.result_order_id IS NOT NULL
                AND (o.id IS NULL OR o.order_type <> 'CARD'
                 OR o.acceptance_receipt_id IS NULL OR o.acceptance_receipt_id <> r.id
                 OR o.buyer_id <> r.buyer_id
                 OR o.buyer_order_no IS NULL OR o.buyer_order_no <> r.buyer_order_no
                 OR NOT (o.project_id <=> r.project_id))
        - sqlCheck:
            expectedResult: 0
            sql: >-
              SELECT COUNT(*) FROM sc_supplier_routing_round r
              LEFT JOIN sc_supply_chain_order o ON o.id = r.order_id
              WHERE r.routing_subject_type = 'STANDARD_REQUEST' AND r.order_id IS NOT NULL
                AND (o.id IS NULL OR o.order_type <> 'CARD' OR o.buyer_id <> r.buyer_id)
        - sqlCheck:
            expectedResult: 0
            sql: >-
              SELECT COUNT(*) FROM (
                SELECT r.buyer_id, r.round_sequence
                FROM sc_supplier_routing_round r
                LEFT JOIN sc_supply_chain_order o ON o.id = r.order_id
                WHERE r.routing_subject_type = 'STANDARD_REQUEST'
                GROUP BY r.buyer_id, r.round_sequence, COALESCE(o.order_no, r.routing_subject_key)
                HAVING COUNT(*) > 1) dup_routing_subject_key
        - sqlCheck:
            expectedResult: 0
            sql: >-
              SELECT COUNT(*) FROM sc_supplier_routing_round r1
              JOIN sc_supply_chain_order o1 ON o1.id = r1.order_id
              JOIN sc_supplier_routing_round r2
                ON r2.buyer_id = r1.buyer_id
               AND r2.routing_subject_type = 'STANDARD_REQUEST'
               AND r2.round_sequence = r1.round_sequence
               AND r2.id <> r1.id
              WHERE r1.routing_subject_type = 'STANDARD_REQUEST'
                AND r2.routing_subject_key = o1.order_no
      changes:
        - sqlFile:
            path: 052-standard-order-project-key.sql
            relativeToChangelogFile: true
            encoding: UTF-8
            splitStatements: true
            stripComments: false
  - changeSet:
      id: 053-offer-external-sku-code
